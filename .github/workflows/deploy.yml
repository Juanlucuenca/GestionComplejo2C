name: CI/CD - Azure App Service

on:
  # Push a master (incluye el merge de un PR a master) -> build + migraciones + deploy
  push:
    branches: [ master ]
  # PR abierto contra master -> solo compila (no toca Azure)
  pull_request:
    branches: [ master ]
  # Permite correrlo a mano desde la pestaña Actions
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: complejoCanchasWEBAPI   # <- nombre EXACTO de tu App Service
  DOTNET_VERSION: '10.0.x'
  SOLUTION: GestionComplejo2C.slnx
  STARTUP_PROJECT: GestionComplejo2C.Presentation
  MIGRATIONS_PROJECT: GestionComplejo2C.Infrastructure

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # necesario para el login OIDC con Azure
      contents: read    # necesario para actions/checkout

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.STARTUP_PROJECT }} --configuration Release --no-build --output ./publish

      # ---- De aca para abajo solo corre en push a master / ejecucion manual ----

      - name: Instalar dotnet-ef
        if: github.event_name != 'pull_request'
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Actualizar base de datos (migraciones EF Core)
        if: github.event_name != 'pull_request'
        env:
          # Se pasa por variable de entorno para que bash no interprete caracteres
          # especiales del password (ej. $).
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "::error::Falta el secret DB_CONNECTION_STRING"
            exit 1
          fi
          dotnet ef database update \
            --project ${{ env.MIGRATIONS_PROJECT }} \
            --startup-project ${{ env.STARTUP_PROJECT }} \
            --configuration Release \
            --no-build \
            --connection "$DB_CONNECTION_STRING"

      - name: Login a Azure (OIDC)
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DBFB7D6E623A4F6589F670983A4F9933 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DC100DC89AE548798BBADA364B105CF3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D7B82F4DF67C4E61A73B517FA8C3AF80 }}

      - name: Deploy a Azure App Service
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ./publish
